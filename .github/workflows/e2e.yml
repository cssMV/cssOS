# CSSOS_WAVE84 20260508 — Playwright e2e CI with auth setup + secret wiring.
# Anonymous-safe specs always run. Auth-gated specs (signed_in_tests/) run only
# when E2E_TEST_EMAIL + E2E_TEST_PASSWORD secrets are configured; otherwise skipped.
name: e2e

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://cssstudio.app' }}
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://cssstudio.app' }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_ADMIN_TOKEN: ${{ secrets.E2E_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: |
            playwright-report/
            test-results/
          retention-days: 7
