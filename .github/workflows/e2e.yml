# CSSOS_WAVE79 20260508 — Playwright e2e against production + nightly cron.
name: e2e

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://cssstudio.app' }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: |
            playwright-report/
            test-results/
          retention-days: 7
