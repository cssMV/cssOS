<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Space+Grotesk:wght@400;500;700&display=swap">
  <style>
    body { margin:0; font-family:"Space Grotesk","Segoe UI",sans-serif; }
    a { color:#00f5a0; } a:hover { color:#7dffd0; }
    .t { font-family:"Syne","Space Grotesk",sans-serif; }
    .mono { font-variant-numeric:tabular-nums; }
  </style>
</helmet>

<div style="width:640px;height:860px;box-sizing:border-box;padding:34px 30px;position:relative;overflow:hidden;
            background:radial-gradient(70% 55% at 50% 44%,rgba(0,245,160,.10),transparent 68%),
                       linear-gradient(170deg,rgba(8,18,15,.95),rgba(3,8,7,.99));
            border:1px solid rgba(0,245,160,.16);border-radius:34px;color:#eafff6;
            display:flex;flex-direction:column;align-items:center;gap:0">

  <div style="display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center">
    <span class="mono" style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(234,255,246,.4)">Now playing</span>
    <span class="t" style="font-size:25px;font-weight:800;line-height:1.2;text-wrap:pretty">{{title}}</span>
  </div>

  <!-- 环形: 四轨围绕中心播放键, 注视即选中 —— 空间原生的取用方式 -->
  <div style="position:relative;width:470px;height:470px;margin-top:34px;flex:0 0 auto">
    <svg viewBox="0 0 470 470" style="position:absolute;inset:0;width:100%;height:100%">
      <circle cx="235" cy="235" r="186" fill="none" stroke="rgba(234,255,246,.09)" stroke-width="1.5"/>
      <circle cx="235" cy="235" r="186" fill="none" stroke="hsl({{th}},100%,58%)" stroke-width="3"
              stroke-linecap="round" stroke-dasharray="1168" stroke-dashoffset="444"
              transform="rotate(-90 235 235)" opacity="0.92"/>
    </svg>

    <sc-for list="{{ring}}" as="r" hint-placeholder-count="4">
      <div style="{{r.pos}}">
        <div style="width:96px;height:96px;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
                    background:hsla({{r.h}},72%,50%,.13);border:1px solid hsla({{r.h}},90%,62%,.34);color:hsl({{r.h}},95%,70%)">
          {{r.icon}}
          <span style="font-size:11.5px;font-weight:700;color:rgba(234,255,246,.9)">{{r.name}}</span>
        </div>
      </div>
    </sc-for>

    <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:13px">
      <button style="all:unset;cursor:pointer;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;
                     background:linear-gradient(150deg,hsl({{th}},100%,58%),hsl({{th}},92%,42%));
                     box-shadow:0 14px 46px hsla({{th}},100%,45%,.46)">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="#04140e"><path d="M8 5.5v13a1 1 0 0 0 1.53.85l10-6.5a1 1 0 0 0 0-1.7l-10-6.5A1 1 0 0 0 8 5.5z"/></svg>
      </button>
      <span class="mono" style="font-size:13px;color:rgba(234,255,246,.55)">1:14 / 3:02</span>
    </div>
  </div>

  <div style="margin-top:auto;display:flex;align-items:center;height:52px;border-radius:999px;overflow:hidden;width:100%;
              border:1px solid hsla(192,90%,62%,.30);background:hsla(192,72%,50%,.07)">
    <sc-for list="{{langs}}" as="it" hint-placeholder-count="3">
      <div style="{{it.style}}"><span style="font-size:15px;font-weight:{{it.w}}">{{it.text}}</span></div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "th":{"editor":"int","default":155,"min":0,"max":360,"section":"主题"}
}'>
class Component extends DCLogic {
  renderVals() {
    const th = this.props.th ?? 155;
    const ico = (d) => `<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
    const items = [
      { h: 155, name: "歌词", d: '<path d="M4 6h16"/><path d="M4 12h11"/><path d="M4 18h14"/>' },
      { h: 192, name: "音乐", d: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>' },
      { h: 268, name: "画面", d: '<rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="m10 9.5 5 3-5 3z"/>' },
      { h: 48,  name: "字幕", d: '<path d="M4 5h16v11H8l-4 3z"/><path d="M8 10h3"/><path d="M14 10h3"/>' },
    ];
    const R = 186, C = 235, S = 48;   // 半径 / 圆心 / 半个卡片
    const ring = items.map((it, i) => {
      const a = (-90 + i * 90) * Math.PI / 180;
      return { ...it, icon: ico(it.d),
        pos: `position:absolute;left:${(C + R * Math.cos(a) - S).toFixed(1)}px;top:${(C + R * Math.sin(a) - S).toFixed(1)}px;` };
    });
    const RR = 26;
    const cell = (pos) => {
      const base = "flex:1;height:52px;display:grid;place-items:center;box-sizing:border-box;";
      if (pos === "on")  return base + `background:hsla(192,85%,52%,.34);border-radius:999px;z-index:2;`;
      if (pos === "aft") return base + `background:hsla(192,70%,50%,.10);border-radius:0 999px 999px 0;margin-left:-${RR}px;padding-left:${RR}px;`
        + `-webkit-mask-image:radial-gradient(circle ${RR}px at 0px 50%,transparent ${RR-0.5}px,#000 ${RR}px);mask-image:radial-gradient(circle ${RR}px at 0px 50%,transparent ${RR-0.5}px,#000 ${RR}px);`;
      return base + `background:hsla(192,70%,50%,.10);border-radius:999px 0 0 999px;margin-right:-${RR}px;padding-right:${RR}px;`
        + `-webkit-mask-image:radial-gradient(circle ${RR}px at 100% 50%,transparent ${RR-0.5}px,#000 ${RR}px);mask-image:radial-gradient(circle ${RR}px at 100% 50%,transparent ${RR-0.5}px,#000 ${RR}px);`;
    };
    const L = ["中文", "English", "日本語"], ai = 0;
    return {
      th, title: "李白 · 饮者三部曲 · 天地留名", ring,
      langs: L.map((text, i) => ({ text, w: i === ai ? 700 : 500,
        style: cell(i === ai ? "on" : (i > ai ? "aft" : "bef")) })),
    };
  }
}
</script>
</body>
</html>
