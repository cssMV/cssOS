<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Space+Grotesk:wght@400;500;700&display=swap">
  <style>
    body { margin:0; font-family:"Space Grotesk","Segoe UI",sans-serif; }
    a { color:#00f5a0; } a:hover { color:#7dffd0; }
    .t { font-family:"Syne","Space Grotesk",sans-serif; }
    .mono { font-variant-numeric:tabular-nums; }
  </style>
</helmet>

<div style="width:1180px;height:520px;box-sizing:border-box;display:flex;flex-direction:column;
            justify-content:flex-end;gap:0;background:#05100c;border-radius:30px;overflow:hidden;position:relative">

  <!-- 画面占满, 控制只是一条丝带 -->
  <div style="position:absolute;inset:0;
              background:radial-gradient(120% 90% at 22% 18%,rgba(0,245,160,.16),transparent 58%),
                         radial-gradient(90% 80% at 82% 72%,rgba(120,90,255,.16),transparent 60%),
                         linear-gradient(160deg,#0a1a14,#050c0a)"></div>
  <div style="position:absolute;inset:0;display:grid;place-items:center;pointer-events:none">
    <span class="t" style="font-size:88px;font-weight:800;color:rgba(234,255,246,.055);letter-spacing:.06em">天地留名</span>
  </div>

  <!-- 逐字情绪字幕 —— 平台招牌, 直接压在画面上 -->
  <div style="position:relative;padding:0 46px 30px;display:flex;gap:11px;align-items:baseline">
    <sc-for list="{{words}}" as="w" hint-placeholder-count="5">
      <span class="t" style="{{w.style}}">{{w.ch}}</span>
    </sc-for>
  </div>

  <!-- 一条丝带: 全部控制收进 64pt 高的玻璃条 -->
  <div style="position:relative;height:96px;box-sizing:border-box;padding:0 28px;display:flex;align-items:center;gap:22px;
              background:rgba(6,16,13,.72);border-top:1px solid rgba(0,245,160,.16)">

    <button style="all:unset;cursor:pointer;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;flex:0 0 64px;
                   background:linear-gradient(150deg,hsl({{th}},100%,58%),hsl({{th}},92%,44%));box-shadow:0 8px 26px hsla({{th}},100%,45%,.4)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#04140e"><path d="M8 5.5v13a1 1 0 0 0 1.53.85l10-6.5a1 1 0 0 0 0-1.7l-10-6.5A1 1 0 0 0 8 5.5z"/></svg>
    </button>

    <div style="flex:1;display:flex;flex-direction:column;gap:7px;min-width:0">
      <div style="display:flex;align-items:baseline;gap:12px;min-width:0">
        <span class="t" style="font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{title}}</span>
        <span class="mono" style="font-size:12px;color:rgba(234,255,246,.4);white-space:nowrap">1:14 / 3:02</span>
      </div>
      <div style="position:relative;height:3px;border-radius:999px;background:rgba(234,255,246,.12)">
        <div style="position:absolute;inset:0 62% 0 0;border-radius:999px;background:linear-gradient(90deg,hsl({{th}},100%,55%),hsl({{th2}},100%,62%))"></div>
      </div>
    </div>

    <!-- 四轨压成四颗指示灯: 亮=该轨在放, 点开才展开 -->
    <div style="display:flex;gap:8px;flex:0 0 auto">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
        <div title="{{d.name}}" style="width:52px;height:52px;border-radius:16px;display:grid;place-items:center;
                    background:hsla({{d.h}},72%,50%,.12);border:1px solid hsla({{d.h}},90%,62%,.32);color:hsl({{d.h}},95%,68%)">{{d.icon}}</div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "th":{"editor":"int","default":155,"min":0,"max":360,"section":"主题"},
  "th2":{"editor":"int","default":192,"min":0,"max":360,"section":"主题"}
}'>
class Component extends DCLogic {
  renderVals() {
    const th = this.props.th ?? 155, th2 = this.props.th2 ?? 192;
    const ico = (d) => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
    // 逐字爆字: 已唱过的字亮 + 带情绪色, 未到的字暗
    const seq = [
      { ch: "天", h: 48,  on: 1 }, { ch: "生", h: 48, on: 1 },
      { ch: "我", h: 342, on: 1 }, { ch: "材", h: 342, on: .86 },
      { ch: "必", h: 155, on: .5 }, { ch: "有", h: 155, on: .28 }, { ch: "用", h: 155, on: .16 },
    ];
    return {
      th, th2,
      title: "李白 · 饮者三部曲 · 天地留名",
      words: seq.map((w) => ({
        ch: w.ch,
        style: `font-size:${44 + w.on * 14}px;font-weight:800;line-height:1;`
             + `color:hsla(${w.h},100%,${62 + w.on * 12}%,${0.28 + w.on * 0.72});`
             + (w.on > .8 ? `text-shadow:0 0 26px hsla(${w.h},100%,60%,.6);` : ""),
      })),
      dots: [
        { h: 155, name: "歌词", icon: ico('<path d="M4 6h16"/><path d="M4 12h11"/><path d="M4 18h14"/>') },
        { h: 192, name: "音乐", icon: ico('<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>') },
        { h: 268, name: "画面", icon: ico('<rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="m10 9.5 5 3-5 3z"/>') },
        { h: 48,  name: "情绪字幕", icon: ico('<path d="M4 5h16v11H8l-4 3z"/><path d="M8 10h3"/><path d="M14 10h3"/>') },
      ],
    };
  }
}
</script>
</body>
</html>
