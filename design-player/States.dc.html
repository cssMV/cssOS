<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap">
  <style>
    body { margin:0; font-family:"Space Grotesk","Segoe UI",sans-serif; }
    a { color:#00f5a0; } a:hover { color:#7dffd0; }
    .t { font-family:"Syne","Space Grotesk",sans-serif; }
    .mono { font-variant-numeric:tabular-nums; letter-spacing:.02em; }
  </style>
</helmet>

<div style="width:1060px;height:1010px;box-sizing:border-box;padding:36px 38px;color:#eafff6;
            background:linear-gradient(170deg,rgba(8,18,15,.96),rgba(3,8,7,.99));
            border:1px solid rgba(0,245,160,.16);border-radius:30px;display:flex;flex-direction:column;gap:22px">

  <div style="display:flex;flex-direction:column;gap:6px">
    <span class="t" style="font-size:23px;font-weight:800">状态 · 六种</span>
    <span class="mono" style="font-size:12px;color:rgba(234,255,246,.44);line-height:1.55">
      全部取自 2026-08-23 实际发生过的情况 —— 不是设想的边界, 是今天调试时逐个撞到的。
    </span>
  </div>

  <div style="display:flex;flex-direction:column;gap:13px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="display:flex;gap:20px;align-items:stretch;padding:17px 18px;border-radius:20px;
                  background:rgba(234,255,246,.035);border:1px solid rgba(234,255,246,.08)">

        <!-- 左: 名称 + 何时发生 -->
        <div style="width:212px;flex:0 0 212px;display:flex;flex-direction:column;gap:5px">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="{{r.led}}"></span>
            <span style="font-size:15px;font-weight:700">{{r.name}}</span>
          </div>
          <span class="mono" style="font-size:10.5px;line-height:1.45;color:rgba(234,255,246,.44)">{{r.when}}</span>
        </div>

        <!-- 中: 四轨条在该状态下的样子 -->
        <div style="flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;align-content:center">
          <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="4">
            <div style="{{c.box}}">
              <span style="font-size:11px;font-weight:700;color:rgba(234,255,246,{{c.ink}})">{{c.name}}</span>
              <span class="mono" style="font-size:9.5px;color:rgba(234,255,246,{{c.dim}})">{{c.note}}</span>
            </div>
          </sc-for>
        </div>

        <!-- 右: 面板给用户看什么 -->
        <div style="width:270px;flex:0 0 270px;display:flex;align-items:center">
          <div style="{{r.chipBox}}">
            <span style="height:16px;color:{{r.chipInk}}">{{r.chipIcon}}</span>
            <span style="font-size:12.5px;font-weight:600;line-height:1.3">{{r.chip}}</span>
          </div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:7px;padding:15px 17px;border-radius:18px;
              background:hsla(48,72%,50%,.08);border:1px solid hsla(48,90%,62%,.26)">
    <span class="mono" style="font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:hsl(48,92%,72%)">一条规矩</span>
    <span style="font-size:13px;line-height:1.6;color:rgba(234,255,246,.86)">
      任何一轨失效, <strong>面板必须说出是哪一轨</strong> —— 不许再出现「Preview unavailable」这种把四轨塌成一句话的兜底。
      四轨分开的意义就在于:坏一轨, 另外三轨照常演。
    </span>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const ico = (d) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
    const H = { 歌词:155, 音乐:192, 画面:268, 情绪字幕:48 };
    const NAMES = ["歌词", "音乐", "画面", "情绪字幕"];

    // state: on = 正常 / wait = 等待 / off = 该轨不可用
    const cell = (name, state, note) => {
      const h = H[name];
      const bg = state === "on" ? .16 : state === "wait" ? .09 : .03;
      const bd = state === "on" ? .42 : state === "wait" ? .26 : .09;
      return { name, note,
        ink: state === "off" ? .3 : .92, dim: state === "off" ? .22 : .5,
        box: `display:flex;flex-direction:column;gap:3px;padding:10px 11px;border-radius:14px;min-height:52px;box-sizing:border-box;justify-content:center;`
           + `background:hsla(${h},72%,50%,${bg});border:1px solid hsla(${h},90%,62%,${bd});`
           + (state === "off" ? `border-style:dashed;` : ``) };
    };
    const led = (c) => `width:8px;height:8px;border-radius:50%;flex:0 0 8px;background:${c};box-shadow:0 0 9px ${c};`;
    const chip = (h, live) => `display:flex;align-items:center;gap:9px;padding:12px 14px;border-radius:15px;box-sizing:border-box;width:100%;`
      + `background:hsla(${h},72%,50%,${live ? .13 : .06});border:1px solid hsla(${h},90%,62%,${live ? .32 : .16});`;

    return { rows: [
      { name: "播放中", when: "四轨对齐, 一起走", led: led("hsl(155,100%,58%)"),
        cells: [cell("歌词","on","zh"), cell("音乐","on","1:14"), cell("画面","on","720P"), cell("情绪字幕","on","209 字")],
        chip: "不显示任何提示 —— 一切正常时面板要安静", chipBox: chip(155, false),
        chipInk: "hsl(155,95%,70%)", chipIcon: ico('<path d="M20 6 9 17l-5-5"/>') },

      { name: "等声音", when: "浏览器/系统拦下有声自动播放。\n画面已经在动, 缺的只是声音。", led: led("hsl(48,100%,60%)"),
        cells: [cell("歌词","on","zh"), cell("音乐","wait","待手势"), cell("画面","on","已在放"), cell("情绪字幕","on","跟画面")],
        chip: "点一下开启声音 · 只挡一次", chipBox: chip(48, true),
        chipInk: "hsl(48,95%,70%)", chipIcon: ico('<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 9a4 4 0 0 1 0 6"/>') },

      { name: "缓冲", when: "音轨在等数据。\n画面不要跟着卡住停。", led: led("hsl(192,100%,60%)"),
        cells: [cell("歌词","on","zh"), cell("音乐","wait","缓冲中"), cell("画面","on","继续"), cell("情绪字幕","wait","等音轨")],
        chip: "只在卡住的那一轨上转, 不糊整块面板", chipBox: chip(192, true),
        chipInk: "hsl(192,95%,70%)", chipIcon: ico('<path d="M12 3a9 9 0 1 0 9 9"/>') },

      { name: "某一轨缺失", when: "这首作品没有真视频, 只有幻灯。\n不是错误, 是它本来的样子。", led: led("hsl(268,100%,68%)"),
        cells: [cell("歌词","on","zh"), cell("音乐","on","1:14"), cell("画面","off","无视频"), cell("情绪字幕","on","209 字")],
        chip: "画面轨落到封面幻灯 · 另外三轨照常", chipBox: chip(268, true),
        chipInk: "hsl(268,95%,74%)", chipIcon: ico('<rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 14 3-3 5 5"/><circle cx="9.5" cy="9" r="1.3"/>') },

      { name: "字幕轨单独失效", when: "这首还没做逐字对齐(subtitle JSON 缺)。\n画面/音乐/歌词三轨都好好的。", led: led("hsl(48,100%,60%)"),
        cells: [cell("歌词","on","zh"), cell("音乐","on","1:14"), cell("画面","on","720P"), cell("情绪字幕","off","未对齐")],
        chip: "只有字幕轨降级为整行 · 画面照放, 声音不停", chipBox: chip(48, true),
        chipInk: "hsl(48,95%,70%)", chipIcon: ico('<path d="M4 5h16v11H8l-4 3z"/><path d="M9 10.5h6"/><path d="m9.6 13.4 4.8-5.8" stroke-dasharray="2 2"/>') },

      { name: "切歌", when: "四轨必须【一起】换。\n今天修的就是这里: 换了媒体没换标题。", led: led("hsl(342,100%,66%)"),
        cells: [cell("歌词","wait","装载"), cell("音乐","wait","装载"), cell("画面","wait","装载"), cell("情绪字幕","wait","装载")],
        chip: "同一个 uuid 广播出去 · 四轨齐变或都不变", chipBox: chip(342, true),
        chipInk: "hsl(342,95%,74%)", chipIcon: ico('<path d="M17 2.1 21 6l-4 3.9"/><path d="M3 12V9a3 3 0 0 1 3-3h15"/><path d="M7 21.9 3 18l4-3.9"/><path d="M21 12v3a3 3 0 0 1-3 3H3"/>') },
    ] };
  }
}
</script>
</body>
</html>
