# CSSOS_WAVE_201 20260516 — Jing: cap cssOS service memory so a runaway
# child OOM-kills cssOS alone (Restart=always auto-recovers in ~5s)
# instead of dragging the whole 16 GB VM into a hang the way today's
# incident did.
#
# VM total: 16 GB.
# Headroom kept for OS / nginx / postgres / ffmpeg / sshd / detector
# timer / system caches: ~4 GB.
# Therefore cssOS Node process gets up to 12 GB hard, 10 GB soft.

[Service]
# Throttle starts above this (memory.high cgroup). Process keeps
# running but kernel reclaims aggressively, signalling pressure
# before we hit the hard wall.
MemoryHigh=10G

# Hard ceiling. systemd-oom (or kernel OOM if systemd-oom is off)
# kills cssOS at this point; Restart=always brings it right back.
MemoryMax=12G

# Also cap the runtime task / fd / process limits while we're at it,
# to keep one bad code path from spawning thousands of subprocesses.
TasksMax=2048
LimitNOFILE=65536
