<!doctype html>
<!-- CSSOS_WAVE_124 20260513 — Jing
     Admin monitoring page for system-generated MVs (anniversary + festival).
     Auth-gated server-side via the API; the page itself is just rendering.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>System MV Dashboard · cssOS</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: #0b0d12; color: #e6e8ee;
    font: 13px/1.4 -apple-system, system-ui, "Helvetica Neue", sans-serif; }
  body { padding: 20px 24px 60px; max-width: 1100px; margin: 0 auto; }
  h1 { font: 700 22px/1.2 -apple-system, system-ui, sans-serif; margin: 0 0 4px; color: #fff; }
  h2 { font: 600 14px/1.2 -apple-system, system-ui, sans-serif; margin: 22px 0 10px;
       color: #00f5a0; letter-spacing: .04em; text-transform: uppercase; }
  .sub { color: #9aa; font-size: 12px; margin-bottom: 18px; }
  .panel { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
           border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .budget { display: flex; gap: 14px; flex-wrap: wrap; }
  .budget .cell { flex: 1; min-width: 150px; background: rgba(0,245,160,0.06);
                  border: 1px solid rgba(0,245,160,0.18); padding: 10px 12px;
                  border-radius: 10px; }
  .budget .cell.warn { background: rgba(255,180,80,0.08); border-color: rgba(255,180,80,0.3); }
  .budget .cell.crit { background: rgba(255,80,90,0.10); border-color: rgba(255,80,90,0.32); }
  .budget .cell .label { font-size: 11px; color: #9aa; letter-spacing: .03em; text-transform: uppercase; }
  .budget .cell .val { font: 700 20px/1.1 ui-monospace, monospace; color: #fff; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 7px 8px; vertical-align: top; }
  thead th { color: #9aa; font-weight: 500; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 11px;
             letter-spacing: .03em; text-transform: uppercase; }
  tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px;
          font-weight: 600; letter-spacing: .02em; }
  .pill.ok { background: rgba(0,245,160,0.18); color: #5effc9; }
  .pill.failed { background: rgba(255,80,90,0.18); color: #ffb0b8; }
  .pill.skipped { background: rgba(160,160,160,0.18); color: #aaa; }
  .pill.queued { background: rgba(255,200,80,0.18); color: #ffd07a; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 18px; }
  .btn { background: #00f5a0; color: #0a0d12; border: 0; padding: 9px 16px; border-radius: 9px;
         font-weight: 700; cursor: pointer; font-size: 13px; letter-spacing: .01em; }
  .btn:hover { background: #2dffb5; }
  .btn.ghost { background: transparent; border: 1px solid rgba(255,255,255,0.18); color: #e6e8ee; }
  .btn.ghost:hover { border-color: #00f5a0; color: #00f5a0; }
  .btn:disabled { opacity: .5; cursor: wait; }
  .small-link { color: #00f5a0; text-decoration: none; font-size: 11px; }
  .small-link:hover { text-decoration: underline; }
  .err { color: #ffb0b8; font-size: 11px; font-style: italic; max-width: 360px;
         overflow: hidden; text-overflow: ellipsis; }
  .empty { text-align: center; padding: 24px; color: #6a6f7a; font-style: italic; }
  #status { font-size: 12px; color: #9aa; margin-left: auto; }
  .header-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="header-row">
  <h1>System MV Dashboard</h1>
  <span id="status"></span>
</div>
<div class="sub" id="dateline">Loading…</div>

<h2>Daily budget</h2>
<div class="panel budget" id="budget"></div>

<div class="actions">
  <button class="btn" id="btn-anniversary">Run anniversary now</button>
  <button class="btn" id="btn-festival">Run festival now</button>
  <button class="btn ghost" id="btn-backfill">Backfill media (batch)</button>
  <button class="btn ghost" id="btn-refresh">Refresh</button>
</div>

<h2>Today's anniversaries (W119)</h2>
<div class="panel"><table id="ann-table">
  <thead><tr><th>Person</th><th>Event</th><th>Status</th><th>Cost</th><th>Work</th><th>Time</th></tr></thead>
  <tbody></tbody>
</table></div>

<h2>Today's festivals (W120)</h2>
<div class="panel"><table id="fest-table">
  <thead><tr><th>Festival</th><th>Status</th><th>Cost</th><th>Work</th><th>Time</th></tr></thead>
  <tbody></tbody>
</table></div>

<script>
(function () {
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function fmtCents(c) {
    var n = Number(c || 0);
    if (!n) return "—";
    return "$" + (n / 100).toFixed(2);
  }
  function fmtTime(iso) {
    if (!iso) return "—";
    try { return new Date(iso).toLocaleTimeString(); } catch (_) { return iso; }
  }
  function pill(status) {
    var s = String(status || "").toLowerCase();
    var label = s || "—";
    return '<span class="pill ' + esc(s) + '">' + esc(label) + '</span>';
  }
  function workLink(id) {
    if (!id) return "—";
    return '<a class="small-link" href="/?cssMV=' + esc(id) + '" target="_blank">' + esc(id.slice(0, 8)) + '…</a>';
  }
  function setStatus(text) {
    document.getElementById("status").textContent = text || "";
  }
  function renderBudget(b) {
    var spent = Number(b && b.spent_cents || 0);
    var cap = Number(b && b.cap_cents || 0);
    var left = Number(b && b.remaining_cents || 0);
    var pct = cap > 0 ? Math.round(100 * spent / cap) : 0;
    var leftCls = pct >= 95 ? "crit" : pct >= 70 ? "warn" : "";
    document.getElementById("budget").innerHTML = ''
      + '<div class="cell"><div class="label">Daily cap</div><div class="val">' + fmtCents(cap) + '</div></div>'
      + '<div class="cell"><div class="label">Spent today</div><div class="val">' + fmtCents(spent) + '</div></div>'
      + '<div class="cell ' + leftCls + '"><div class="label">Remaining</div><div class="val">' + fmtCents(left) + '</div></div>'
      + '<div class="cell"><div class="label">Utilization</div><div class="val">' + pct + '%</div></div>';
  }
  function renderTable(rows, kind) {
    var tbody = document.querySelector("#" + (kind === "ann" ? "ann" : "fest") + "-table tbody");
    if (!rows.length) {
      var span = kind === "ann" ? 6 : 5;
      tbody.innerHTML = '<tr><td colspan="' + span + '" class="empty">No ' + kind + ' runs today.</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(function (r) {
      var name = r.name_zh || r.name_en || r.person_id || r.festival_id || "—";
      var err = r.error_detail ? '<div class="err" title="' + esc(r.error_detail) + '">' + esc(r.error_detail) + '</div>' : '';
      if (kind === "ann") {
        return '<tr>'
          + '<td>' + esc(name) + (err ? err : '') + '</td>'
          + '<td>' + (r.event_type === "death" ? "🕯️ death" : "🎂 birth") + '</td>'
          + '<td>' + pill(r.status) + '</td>'
          + '<td>' + fmtCents(r.cost_cents) + '</td>'
          + '<td>' + workLink(r.work_id) + '</td>'
          + '<td>' + fmtTime(r.created_at) + '</td>'
          + '</tr>';
      }
      return '<tr>'
        + '<td>' + esc(name) + (err ? err : '') + '</td>'
        + '<td>' + pill(r.status) + '</td>'
        + '<td>' + fmtCents(r.cost_cents) + '</td>'
        + '<td>' + workLink(r.work_id) + '</td>'
        + '<td>' + fmtTime(r.created_at) + '</td>'
        + '</tr>';
    }).join("");
  }
  async function refresh() {
    setStatus("loading…");
    try {
      var r = await fetch("/api/admin/system-mvs/today", { credentials: "include" });
      var j = await r.json();
      if (!r.ok || !j.ok) {
        setStatus("error: " + (j.error || r.status));
        if (r.status === 401) setStatus("sign in as admin via the main site, then refresh.");
        if (r.status === 403) setStatus("admin only — you are signed in but not an admin.");
        return;
      }
      document.getElementById("dateline").textContent = "Run date: " + (j.data.date || "—");
      renderBudget(j.data.budget);
      renderTable(j.data.anniversaries || [], "ann");
      renderTable(j.data.festivals || [], "fest");
      setStatus("updated " + new Date().toLocaleTimeString());
    } catch (err) {
      setStatus("error: " + (err && err.message || err));
    }
  }
  async function postAction(url, label, btn) {
    btn.disabled = true;
    var orig = btn.textContent;
    btn.textContent = label + "…";
    try {
      var r = await fetch(url, { method: "POST", credentials: "include" });
      var j = await r.json();
      if (r.ok && j.ok) {
        setStatus(label + " ok");
        await refresh();
      } else {
        setStatus(label + " failed: " + (j.error || r.status));
      }
    } catch (err) {
      setStatus(label + " threw: " + (err && err.message || err));
    } finally {
      btn.disabled = false;
      btn.textContent = orig;
    }
  }
  document.getElementById("btn-anniversary").addEventListener("click", function (e) {
    postAction("/api/anniversary/run-now", "Anniversary", e.target);
  });
  document.getElementById("btn-festival").addEventListener("click", function (e) {
    postAction("/api/festivals/run-now", "Festival", e.target);
  });
  document.getElementById("btn-backfill").addEventListener("click", function (e) {
    postAction("/api/system-media/backfill-now", "Backfill", e.target);
  });
  document.getElementById("btn-refresh").addEventListener("click", refresh);
  refresh();
  setInterval(refresh, 30000);
})();
</script>
</body>
</html>
