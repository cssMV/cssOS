<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cssMV Lite</title>
    <link rel="stylesheet" href="/style.mv-lite.css" />
  </head>
  <body>
    <main class="mv-lite-shell">
      <section class="mv-lite-hero">
        <p class="mv-lite-kicker">cssMV</p>
        <h1>一句话，生成一支 MV。</h1>
        <p class="mv-lite-subtitle">
          不进编辑器，不配参数。输入一句想法，系统自动跑歌词、音乐、视频整条链。
        </p>
      </section>

      <section class="mv-lite-compose" aria-label="生成面板">
        <label class="mv-lite-label" for="mv-lite-prompt">你想做什么 MV？</label>
        <div class="mv-lite-compose-row">
          <input
            id="mv-lite-prompt"
            class="mv-lite-input"
            type="text"
            placeholder="例如：史诗级骑士爱情悲剧"
          />
          <button id="mv-lite-generate" class="mv-lite-button" type="button">生成 MV</button>
        </div>
        <p id="mv-lite-hint" class="mv-lite-hint">默认会走 cssMV 自研视频引擎。</p>
      </section>

      <section class="mv-lite-results">
        <div class="mv-lite-results-head">
          <h2>生成结果</h2>
          <span id="mv-lite-count" class="mv-lite-count">0</span>
        </div>
        <div id="mv-lite-grid" class="mv-lite-grid" aria-live="polite"></div>
      </section>
    </main>

    <script type="module" src="/mv-lite.js"></script>
  </body>
</html>
