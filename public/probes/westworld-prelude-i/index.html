<!doctype html>
<html lang="zh-CN">
<head>

  <title>西部世界歌剧MV·前奏曲 I</title>
  <style>
    body { margin: 0; font-family: Georgia, serif; background: #05070b; color: #f5efe3; }

  <main>

    <video controls playsinline poster="/probes/westworld-prelude-i/poster.jpg">
      <source src="/probes/westworld-prelude-i/video.mp4" type="video/mp4" />
    </video>
    <div class="grid">
      <div class="card"><img src="https://cssstudio.app/api/shared-assets/blob?path=westworld-prelude-i%2F01_android_piano.png" alt="01_android_piano"><div class="label">01 仿生人钢琴</div></div>

      <div class="card"><img src="https://cssstudio.app/api/shared-assets/blob?path=westworld-prelude-i%2F04_female_android_closeup.png" alt="04_female_android_closeup"><div class="label">04 女性仿生人特写</div></div>
    </div>
  </main>
</body>
</html>
