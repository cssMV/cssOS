<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>西部世界歌剧MV·前奏曲 II</title>
  <style>
    body { margin: 0; font-family: Georgia, serif; background: #05070b; color: #f5efe3; }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 60px; }
    h1 { font-size: 32px; margin: 0 0 16px; }
    p { color: #c8c1b4; line-height: 1.6; }
    video { width: 100%; border-radius: 18px; background: #000; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 16px; margin-top: 24px; }
    img { width: 100%; display: block; border-radius: 14px; }
    .card { background: rgba(255,255,255,0.04); padding: 12px; border-radius: 16px; }
    .label { margin-top: 8px; font-size: 14px; color: #d8cfbe; }
  </style>
</head>
<body>
  <main>
    <h1>西部世界歌剧MV·前奏曲 II</h1>
    <p>当前版本为基于脚本约束与 OpenAI 图像生成的前奏短片验收版，重点检查人物、场景、动作与风格。</p>
    <video controls playsinline poster="/probes/westworld-prelude-ii/poster.jpg">
      <source src="/probes/westworld-prelude-ii/video.mp4" type="video/mp4" />
    </video>
    <div class="grid">
      <div class="card"><img src="https://cssstudio.app/api/shared-assets/blob?path=westworld-prelude-ii%2F01_corridor_walk.png" alt="01_corridor_walk"><div class="label">01 地下走廊行进</div></div>
      <div class="card"><img src="https://cssstudio.app/api/shared-assets/blob?path=westworld-prelude-ii%2F02_host_chamber.png" alt="02_host_chamber"><div class="label">02 沉睡宿主体舱</div></div>
      <div class="card"><img src="https://cssstudio.app/api/shared-assets/blob?path=westworld-prelude-ii%2F03_player_piano_hall.png" alt="03_player_piano_hall"><div class="label">03 自动钢琴厅</div></div>
      <div class="card"><img src="https://cssstudio.app/api/shared-assets/blob?path=westworld-prelude-ii%2F04_eye_reflection.png" alt="04_eye_reflection"><div class="label">04 眼中倒影</div></div>
    </div>
  </main>
</body>
</html>
