<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CSS Studio — App Store screenshot 01 (real login, framed)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { width: 1242px; height: 2688px; }
  body {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    color: #fff;
    background: radial-gradient(120% 68% at 50% -6%, #0c5a3f 0%, #08361f 36%, #04140d 70%, #020a07 100%);
    overflow: hidden; position: relative;
  }
  .wrap { padding: 140px 96px 0; text-align: center; }

  .brand {
    display: inline-flex; align-items: center; gap: 16px;
    padding: 18px 38px; border-radius: 999px;
    border: 2px solid rgba(0,245,160,0.45); background: rgba(0,245,160,0.06);
    font-size: 38px; font-weight: 700; color: #00f5a0;
  }
  .brand .dot { width: 15px; height: 15px; border-radius: 50%; background: #00f5a0; box-shadow: 0 0 18px #00f5a0; }

  h1 { margin-top: 60px; font-size: 142px; line-height: 1.02; font-weight: 800; letter-spacing: -0.03em; }
  h1 .mint { background: linear-gradient(180deg,#6bffce 0%,#00f0a0 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

  .sub { margin-top: 48px; font-size: 52px; line-height: 1.3; font-weight: 400; color: rgba(220,235,228,0.6); }
  .sub b { display: block; font-weight: 700; color: #f3fbf7; }

  .device {
    margin: 150px auto 0; width: 960px;
    border-radius: 64px; padding: 16px;
    background: #05100b; border: 3px solid rgba(0,245,160,0.16);
    box-shadow: 0 44px 130px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .screen { width: 100%; height: 980px; overflow: hidden; border-radius: 52px; }
  .device img { display: block; width: 100%; height: auto; object-fit: cover; object-position: top; }

  .footer { position: absolute; left: 0; right: 0; bottom: 130px; text-align: center; }
  .footer .lead { font-size: 50px; font-weight: 800; color: #eafff6; }
  .footer .plats { margin-top: 20px; font-size: 40px; font-weight: 500; color: rgba(180,210,196,0.7); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="dot"></span>CSS Studio</div>
    <h1>Sign in.<br><span class="mint">Start creating.</span></h1>
    <p class="sub">One tap. Your music video,<b>generated by AI in minutes.</b></p>
    <div class="device"><div class="screen"><img src="_real-login.png" alt="CSS Studio login" /></div></div>
  </div>
  <div class="footer">
    <div class="lead">Sign in with Apple</div>
    <div class="plats">Private · one tap · no passwords</div>
  </div>
</body>
</html>
